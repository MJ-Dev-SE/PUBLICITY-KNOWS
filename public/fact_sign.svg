<svg width="216" height="189" viewBox="0 0 216 189" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Hand-painted FACT sign with an eye illustration on wood">
  <defs>
    <!-- Wood base gradient -->
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4a2f1c"/>
      <stop offset="0.5" stop-color="#3a2413"/>
      <stop offset="1" stop-color="#2c1a0d"/>
    </linearGradient>

    <!-- Wood grain texture -->
    <filter id="grain" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.09" numOctaves="4" seed="7" result="noise"/>
      <feColorMatrix in="noise" type="matrix"
        values="0 0 0 0 0.28
                0 0 0 0 0.17
                0 0 0 0 0.08
                0 0 0 0.55 0" result="grain"/>
      <feComposite in="grain" in2="SourceGraphic" operator="over"/>
    </filter>

    <!-- Rough paint edge for lettering / eye -->
    <filter id="paint" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.09" numOctaves="2" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>

  <!-- Wooden plank -->
  <rect width="216" height="189" fill="url(#wood)"/>
  <rect width="216" height="189" fill="#000" opacity="0.35" filter="url(#grain)"/>

  <!-- subtle plank seams -->
  <g stroke="#000" stroke-opacity="0.18" stroke-width="1">
    <line x1="0" y1="63" x2="216" y2="61"/>
    <line x1="0" y1="128" x2="216" y2="130"/>
  </g>

  <!-- Nail holes at top -->
  <g fill="#1a0f06">
    <ellipse cx="70" cy="9" rx="4" ry="3"/>
    <ellipse cx="150" cy="9" rx="4" ry="3"/>
  </g>
  <g fill="#000" opacity="0.5">
    <ellipse cx="70" cy="10.5" rx="2.5" ry="1.6"/>
    <ellipse cx="150" cy="10.5" rx="2.5" ry="1.6"/>
  </g>

  <!-- Painted content -->
  <g fill="#efe7d6" filter="url(#paint)">
    <!-- FACT -->
    <text x="108" y="72"
          font-family="'Arial Black', 'Helvetica', sans-serif"
          font-weight="900" font-size="62" letter-spacing="1"
          text-anchor="middle">FACT</text>

    <!-- Eye -->
    <g transform="translate(108 138)">
      <!-- eye outline (almond, pointed corners) -->
      <path d="M -40 0 Q 0 -26 40 0 Q 0 26 -40 0 Z"
            fill="none" stroke="#efe7d6" stroke-width="3.4" stroke-linejoin="round"/>
      <!-- iris -->
      <circle cx="0" cy="0" r="12" fill="none" stroke="#efe7d6" stroke-width="3.4"/>
      <!-- pupil -->
      <circle cx="0" cy="0" r="4.6" fill="#efe7d6"/>

      <!-- eyelashes radiating up -->
      <g stroke="#efe7d6" stroke-width="3" stroke-linecap="round">
        <line x1="-34" y1="-9"  x2="-40" y2="-19"/>
        <line x1="-24" y1="-15" x2="-28" y2="-27"/>
        <line x1="-13" y1="-19" x2="-15" y2="-32"/>
        <line x1="0"   y1="-21" x2="0"   y2="-34"/>
        <line x1="13"  y1="-19" x2="15"  y2="-32"/>
        <line x1="24"  y1="-15" x2="28"  y2="-27"/>
        <line x1="34"  y1="-9"  x2="40"  y2="-19"/>
      </g>
    </g>
  </g>
</svg>
